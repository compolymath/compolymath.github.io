<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        {% if page.title %}
            {{ page.title }} · {{ site.title }}
        {% else %}
            {{ site.title }}
        {% endif %}
    </title>

    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
</head>

<body>

<header>
    <nav>
        <a href="{{ '/' | relative_url }}">
            {{ site.title }}
        </a>

        <a href="{{ '/about/' | relative_url }}">
            About
        </a>

        <a href="{{ '/blog/' | relative_url }}">
            Blog
        </a>
    </nav>
</header>

<main>
    {{ content }}
</main>

<footer>
    <p>
        © {{ 'now' | date: "%Y" }} {{ site.title }}
    </p>
</footer>

</body>
</html>
